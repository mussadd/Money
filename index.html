<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Money">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Money</title>
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--text:#0d0d12;--mut:#8a8a93;--line:rgba(60,60,67,.11);--track:#ebebf0;
  --acc:#3b6cff;--good:#22a06b;--warn:#e19a12;--bad:#e5484d;--sheet:#f2f2f7;
  --hero1:#15171d;--hero2:#242731;--tab:rgba(255,255,255,.84);--key:#fff;--shadow:0 8px 28px rgba(0,0,0,.10);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#000;--card:#141417;--text:#f3f3f6;--mut:#8d8d96;--line:rgba(255,255,255,.08);--track:#26262b;
  --acc:#4d7bff;--good:#3dd68c;--warn:#ffb224;--bad:#ff6369;--sheet:#0c0c0f;
  --hero1:#1a1d26;--hero2:#262b3b;--tab:rgba(30,30,35,.84);--key:#1c1c20;--shadow:0 8px 28px rgba(0,0,0,.5);
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font:15px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body.lock{position:fixed;left:0;right:0;width:100%}
html{overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;text-align:inherit}
input,select{font:inherit;color:inherit}
svg{display:block;flex:none}
.n{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hide{display:none!important}
#app{transition:filter .15s}
body.blur #app{filter:blur(22px)}
.page{max-width:540px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 112px);min-height:100vh}
/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;margin:4px 2px 14px;gap:10px}
.top .d{font-size:13px;color:var(--mut);font-weight:500}
.top h1{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.rbtn{width:36px;height:36px;border-radius:18px;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--text);flex:none}
.rbtn:active{opacity:.6}
.back{display:flex;align-items:center;gap:2px;color:var(--acc);font-size:16px;margin:0 0 6px -6px;padding:4px 6px}
/* hero */
.hero{background:linear-gradient(145deg,var(--hero1),var(--hero2));color:#fff;border-radius:26px;padding:18px 18px 15px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(77,123,255,.38),transparent 70%);pointer-events:none}
.hero .l{font-size:12px;color:#a7a9b4;letter-spacing:.04em;font-weight:500}
.hero .big{font-size:54px;font-weight:700;line-height:1;margin:7px 0 5px;letter-spacing:-.04em}
.hero .big small{font-size:17px;color:#a7a9b4;font-weight:600;margin-left:5px;letter-spacing:0}
.hero .s{font-size:12.5px;color:#a7a9b4}
.hero .eye{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#c9cbd4;z-index:2}
.hero .eye:active{background:rgba(255,255,255,.08)}
.stack{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:15px;border-top:1px solid rgba(255,255,255,.09);padding-top:12px;position:relative;z-index:1}
.stack>button+button{border-left:1px solid rgba(255,255,255,.09);padding-left:12px}
.stack .k{font-size:11px;color:#a7a9b4}.stack .v{font-size:18px;font-weight:650;margin-top:2px;white-space:nowrap}
.hbar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);margin-top:12px;overflow:hidden;position:relative;z-index:1}
.hbar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#3b6cff,#86a6ff)}
/* sections, cards, rows */
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 9px}
.sec b{font-size:16px;font-weight:650;letter-spacing:-.01em}.sec span,.sec button{font-size:12.5px;color:var(--mut)}
.sec button{color:var(--acc);font-weight:600;font-size:13.5px}
.grp{font-size:12px;color:var(--mut);font-weight:600;display:flex;justify-content:space-between;margin:18px 6px 7px;text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--card);border-radius:20px;padding:2px 14px}
.card.pad{padding:14px 16px}
.it{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left;min-height:56px}
.card>.it:first-child,.card>.swr:first-child .it,.it.first{border-top:0}
button.it:active,.tap:active{opacity:.6}
.ib{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card))}
.ib.sm{width:30px;height:30px;border-radius:9px}
.ib.lg{width:52px;height:52px;border-radius:16px}
.mid{flex:1;min-width:0}.mid .t{font-size:15px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid .s{font-size:12.5px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-size:15px;font-weight:600;white-space:nowrap}
.go{border-radius:14px;padding:7px 13px;font-size:13px;font-weight:650;background:var(--text);color:var(--bg);flex:none}
.go:active{opacity:.7}
.go.soft{background:var(--track);color:var(--text)}
.chev{color:var(--mut);opacity:.6}
.tag{font-size:10.5px;font-weight:650;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:1px}
.tag.est{background:color-mix(in srgb,var(--warn) 18%,var(--card));color:var(--warn)}
.tag.paid{background:color-mix(in srgb,var(--good) 16%,var(--card));color:var(--good)}
.tag.late{background:color-mix(in srgb,var(--bad) 15%,var(--card));color:var(--bad)}
.bar{height:5px;border-radius:3px;background:var(--track);overflow:hidden}.bar i{display:block;height:100%;border-radius:3px}
.muted{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}.b{font-weight:650}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.empty{color:var(--mut);font-size:14px;padding:16px 0;text-align:center}
.done{opacity:.45}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 2px}
.tile{text-align:center;padding:2px 0}
.tile:active{transform:scale(.94)}
.tile .r{position:relative;width:52px;height:52px;margin:0 auto}
.tile .r>svg{position:absolute;inset:0}
.tile .r .ib{position:absolute;inset:6px;width:auto;height:auto;border-radius:50%}
.tile .nm{font-size:11.5px;font-weight:550;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .lf{font-size:11px;color:var(--mut)}
/* usuals */
.us{display:flex;gap:7px;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.us::-webkit-scrollbar{display:none}
.u{flex:none;display:flex;align-items:center;gap:7px;background:var(--card);border-radius:17px;padding:7px 12px 7px 7px;font-size:13.5px;font-weight:600}
.u:active{transform:scale(.95)}
.u .ib{width:24px;height:24px;border-radius:8px}
.u b{color:var(--mut);font-weight:600}
/* tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 10px);width:calc(100% - 28px);max-width:420px;height:64px;border-radius:32px;
  background:var(--tab);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:space-around;padding:0 8px;z-index:10}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mut);width:70px;font-weight:500}
.tabbar button.on{color:var(--text);font-weight:650}
.tabbar .plus{width:50px;height:50px;border-radius:25px;background:var(--acc);color:#fff;justify-content:center;box-shadow:0 6px 16px color-mix(in srgb,var(--acc) 45%,transparent)}
.tabbar .plus:active{transform:scale(.92)}
/* activity */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.cal .h{font-size:10.5px;color:var(--mut);text-align:center;font-weight:500}
.dd{height:42px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;background:var(--track)}
.dd small{font-size:9.5px;font-weight:500;opacity:.8;margin-top:1px}
.dd.g{background:color-mix(in srgb,var(--good) 20%,var(--card));color:color-mix(in srgb,var(--good) 80%,var(--text))}
.dd.y{background:color-mix(in srgb,var(--warn) 24%,var(--card))}
.dd.r{background:color-mix(in srgb,var(--bad) 22%,var(--card));color:color-mix(in srgb,var(--bad) 85%,var(--text))}
.dd.z{background:transparent;border:1px dashed color-mix(in srgb,var(--mut) 40%,transparent)}
.dd.f{background:transparent;color:color-mix(in srgb,var(--mut) 60%,transparent);font-weight:500}
.dd.e{background:transparent}
.dd.sel{background:var(--text)!important;color:var(--bg)!important;border:0}
.dd.today{box-shadow:inset 0 0 0 1.5px var(--text)}
.seg{display:flex;gap:6px;margin:14px 0 2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:7px 14px;border-radius:15px;font-size:13px;font-weight:550;background:var(--card);color:var(--mut);flex:none}
.seg button.on{background:var(--text);color:var(--bg)}
.day{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin:16px 6px 6px;font-weight:550}
/* swipe rows */
.swr{position:relative;overflow:hidden;margin:0 -14px;padding:0 14px}
.swr .act{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;width:84px;color:#fff;font-weight:600;font-size:14px}
.swr .act.del{right:0;background:var(--bad)}.swr .act.ed{left:0;background:var(--acc)}
.swr .in{position:relative;background:var(--card);transition:transform .22s cubic-bezier(.2,.8,.2,1);margin:0 -14px;padding:0 14px}
.swr .in.drag{transition:none}
/* sheets */
.sheet{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end;pointer-events:none}
.sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.32);opacity:0;transition:opacity .25s}
.sheet .pn{position:relative;background:var(--sheet);border-radius:28px 28px 0 0;max-height:94vh;display:flex;flex-direction:column;
  transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.85,.2,1);max-width:540px;width:100%;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.15)}
.sheet .pn.drag{transition:none}
.sheet.open{pointer-events:auto}.sheet.open .bd{opacity:1}.sheet.open .pn{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--mut) 45%,transparent);margin:7px auto 0}
.shd{display:flex;justify-content:space-between;align-items:center;padding:8px 16px 6px;touch-action:none}
.shd b{font-size:16px;font-weight:650;display:flex;align-items:center;gap:7px}
.x{width:30px;height:30px;border-radius:15px;background:var(--track);display:flex;align-items:center;justify-content:center;color:var(--mut)}
.shb{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 8px;flex:1;overscroll-behavior:contain}
.shf{padding:6px 14px calc(env(safe-area-inset-bottom) + 12px)}
.sg{display:flex;background:var(--track);border-radius:11px;padding:2px;margin:2px 0 4px}
.sg button{flex:1;text-align:center;padding:7px 4px;font-size:13px;border-radius:9px;font-weight:550;color:var(--mut)}
.sg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.disp{text-align:center;font-size:52px;font-weight:700;letter-spacing:-.035em;padding:6px 0 2px;min-height:68px}
.disp small{font-size:18px;color:var(--mut);font-weight:600;letter-spacing:0}
.disp .ph{color:color-mix(in srgb,var(--mut) 60%,transparent)}
.cap{font-size:12.5px;color:var(--mut);text-align:center;margin-top:2px}
.lbl{font-size:12px;font-weight:600;color:var(--mut);margin:14px 4px 7px;text-transform:uppercase;letter-spacing:.05em}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px 0;margin:12px 0 6px}
.cat{text-align:center}
.cat .ib{width:48px;height:48px;border-radius:15px;margin:0 auto;transition:box-shadow .15s}
.cat .t{font-size:11px;margin-top:4px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat.on .ib{box-shadow:0 0 0 2.5px var(--text)}
.cat:active .ib{transform:scale(.92)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:1px 0 3px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 12px;border-radius:14px;font-size:13px;font-weight:550;background:var(--card);color:var(--mut);flex:none;white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.key{height:48px;border-radius:13px;background:var(--key);display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:450}
.key:active{background:var(--track)}
.save{width:100%;height:52px;border-radius:16px;background:var(--text);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:650;font-size:16.5px;margin-top:8px}
.save:active{opacity:.8}.save:disabled{opacity:.45}
.save.red{background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--bad)}
.save.soft{background:var(--card);color:var(--text)}
.btns{display:flex;gap:8px}.btns .save{flex:1}
.field{width:100%;background:var(--card);border:0;border-radius:13px;padding:12px 14px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.opts{display:flex;gap:6px;margin:8px 0 0}.opts button{flex:1;background:var(--card);border-radius:12px;padding:9px 4px;font-size:12.5px;color:var(--mut);text-align:center;font-weight:550}
.opts button.on{color:var(--text);box-shadow:inset 0 0 0 1.5px var(--text)}
.opt{display:flex;justify-content:space-between;align-items:center;padding:0 2px;min-height:50px;font-size:15px;border-top:1px solid var(--line);gap:10px}
.opt:first-child{border:0}.opt>span{color:var(--mut)}
.opt select,.opt input{background:transparent;border:0;text-align:right;color:var(--mut);font-size:15px;outline:none;max-width:60%;-webkit-appearance:none;appearance:none}
.tg{width:51px;height:31px;border-radius:16px;background:var(--track);position:relative;flex:none;transition:background .2s}
.tg:after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.tg.on{background:#34c759}.tg.on:after{transform:translateX(20px)}
.hist{display:flex;align-items:flex-end;gap:10px;height:120px;padding:8px 4px 0}
.hb{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.hb b{display:block;font-size:11px;color:var(--text);font-weight:600;margin-bottom:3px}
.hb i{display:block;background:color-mix(in srgb,var(--acc) 30%,var(--card));border-radius:8px;margin-bottom:5px;min-height:4px}
.hb.now i{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--warn) 40%,var(--card)) 0 4px,color-mix(in srgb,var(--warn) 18%,var(--card)) 4px 8px)}
.line{display:flex;justify-content:space-between;padding:11px 0;font-size:14.5px;border-top:1px solid var(--line);gap:8px}
.line:first-child{border:0}.line span{color:var(--mut)}
input[type=range]{width:100%;accent-color:var(--acc)}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 86px);transform:translate(-50%,24px);opacity:0;pointer-events:none;transition:all .25s;z-index:50;
  background:#1c1c22;color:#fff;padding:12px 16px;border-radius:16px;font-size:14px;font-weight:550;width:calc(100% - 44px);max-width:400px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast.up{bottom:auto;top:calc(env(safe-area-inset-top) + 10px)}
.toast button{color:#8fb0ff;font-weight:700;flex:none}
@media (prefers-color-scheme: dark){.toast{background:#2c2c33}}
/* lock */
.lockscr{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px}
.lockscr .logo{width:76px;height:76px;border-radius:20px;background:linear-gradient(145deg,#1b1e27,#2b3248);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:var(--shadow)}
.lockscr h2{font-size:20px;font-weight:650}
.lockscr .go{padding:12px 20px;font-size:15px;display:flex;gap:8px;align-items:center;border-radius:16px}
.hap{position:fixed;left:-200px;top:0;opacity:0;pointer-events:none}
.ptr{height:0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;color:var(--mut);font-size:12.5px;transition:height .2s}
.loading{text-align:center;color:var(--mut);padding:120px 0}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--track);border-top-color:var(--mut);animation:sp 0.8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><main class="page" id="page"><div class="loading"><div class="spin"></div>Loading…</div></main></div>
<nav class="tabbar hide" id="tabbar"></nav>
<div class="sheet" id="sheet"><div class="bd" id="bd"></div><div class="pn" id="pn"></div></div>
<div class="toast" id="toast"></div>
<div class="lockscr hide" id="lock"></div>
<label class="hap" id="hap"><input type="checkbox" switch></label>
<script>
/* ============ storage & state ============ */
const LS = { get(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } },
             set(k,v){ try { localStorage.setItem(k, v); } catch(e){} }, del(k){ try { localStorage.removeItem(k); } catch(e){} } };
let API = LS.get('mm_api'), TOKEN = LS.get('mm_token');
let D = null, A = null, view = 'home', stack = [], offset = 0, selDay = null, filt = 'all', lastLoad = 0, loading = false;
try { const c = JSON.parse(LS.get('mm_cache') || 'null'); if (c && c.period) D = c; } catch(e){}

/* ============ helpers ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jq = v => esc(JSON.stringify(v));                     // safe value inside onclick="..."
const f0 = n => Math.round(n || 0).toLocaleString('en-US');
const f2 = n => Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fm = n => Math.abs(n % 1) > 0.004 ? f2(n) : f0(n);
const fk = n => Math.abs(n) >= 10000 ? (Math.round(n / 100) / 10).toLocaleString('en-US') + 'k' : f0(n);
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOWL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const pd = k => { const [y,m,d] = k.split('-').map(Number); return new Date(Date.UTC(y, m-1, d)); };
const isK = k => /^\d{4}-\d{2}-\d{2}$/.test(String(k || ''));
const nice = k => isK(k) ? pd(k).getUTCDate() + ' ' + MON[pd(k).getUTCMonth()] : '';
const monY = k => isK(k) ? MON[pd(k).getUTCMonth()] + ' ' + pd(k).getUTCFullYear() : '';
const today = () => D ? D.period.todayKey : new Date().toISOString().slice(0, 10);
const dTo = k => Math.round((pd(k) - pd(today())) / 864e5);
const rel = k => { if (!isK(k)) return ''; const n = dTo(k); return n === 0 ? 'Due today' : n === 1 ? 'Due tomorrow' : n < 0 ? (-n) + (n === -1 ? ' day' : ' days') + ' late' : n <= 6 ? 'Due in ' + n + ' days' : 'Due ' + nice(k); };

/* ============ api, cache, offline queue ============ */
async function api(action, payload){
  const r = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ token: TOKEN, action }, payload || {})) });
  const j = await r.json();
  if (j.auth === false) { setup('This token was not accepted. Check it and try again.'); throw new Error('Not authorised'); }
  if (j.ok === false) throw new Error(j.message || 'Something went wrong');
  return j;
}
async function load(){
  if (!API || !TOKEN) return setup();
  if (loading) return; loading = true;
  try {
    await flushQueue(true);
    const d = await api('data', { offset: 0 });
    D = d; lastLoad = Date.now();
    LS.set('mm_cache', JSON.stringify(d));
    if (offset !== 0) A = await api('data', { offset });
    render();
  } catch(e) {
    if (!D) $('page').innerHTML = `<div class="card pad" style="margin-top:70px"><div class="b">Couldn’t load</div><div class="sm muted" style="margin:6px 0 12px">${esc(e.message)}</div><div class="btns"><button class="save" onclick="load()">Try again</button><button class="save soft" onclick="setup()">Settings</button></div></div>`;
    else toast(isNet(e) ? 'Offline · showing your last numbers' : e.message);
  } finally { loading = false; ptrDone(); }
}
const Q = { get(){ try { return JSON.parse(LS.get('mm_queue') || '[]'); } catch(e){ return []; } }, set(q){ LS.set('mm_queue', JSON.stringify(q)); } };
async function flushQueue(quiet){
  let q = Q.get(); if (!q.length) return;
  let sent = 0;
  while (q.length) {
    try { await api('add', q[0]); sent++; } catch(e) { if (isNet(e)) break; toast('Couldn’t send: ' + e.message); }
    q.shift(); Q.set(q);
  }
  if (sent && !quiet) toast('Sent ' + sent + ' saved offline');
  else if (sent) setTimeout(() => toast(sent + ' offline ' + (sent > 1 ? 'entries' : 'entry') + ' sent'), 300);
}
window.addEventListener('online', () => { flushQueue(); load(); });

// add something, with Undo; works offline
let adding = false;
async function addEntry(p, after){
  if (adding) return; adding = true; haptic();
  const btn = document.querySelector('#pn .save.main'); if (btn) btn.disabled = true;
  try {
    const r = await api('add', p);
    closeSheet();
    toast('✓ ' + (r.message || 'Saved'), () => undoAdd(r));
    if (after) after(r);
    load();
  } catch(e) {
    if (isNet(e)) { const q = Q.get(); const id = Date.now(); q.push(Object.assign({ qid: id }, p)); Q.set(q); closeSheet();
      toast('Saved offline · sends when you’re online', () => { Q.set(Q.get().filter(x => x.qid !== id)); toast('Removed'); }); }
    else { toast(e.message); }
  } finally { adding = false; if (btn) btn.disabled = false; }
}
async function undoAdd(r){
  try { await api('delete', { row: r.row, date: r.date, amt: r.amt }); toast('Undone'); load(); } catch(e) { toast(e.message); }
}
async function run(action, payload, msg){
  busy();
  try { const r = await api(action, payload); haptic(); closeSheet(); toast(msg || ('✓ ' + (r.message || 'Saved'))); await load(); return r; }
  catch(e) { unbusy(); toast(isNet(e) ? 'You’re offline. Try again when connected.' : e.message); }
}

function unbusy(){ const b = document.querySelector('#pn .save.main'); if (b) { b.disabled = false; b.textContent = b.dataset.t || 'Save'; } }

/* ============ Face ID lock (passkey on this iPhone) ============ */
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64 = s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0));
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
const fidOn = () => !!LS.get('mm_cred');
const fidOk = () => !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext);
let locked = false, unlocking = false;
function setLocked(v){
  locked = v; const L = $('lock');
  if (v) {
    L.innerHTML = `<div class="logo">${svg('lock', 34, 1.7)}</div><h2>Money is locked</h2>
      <div class="sm muted" id="lockMsg" style="text-align:center">Use Face ID to see your numbers</div>
      <button class="go" onclick="unlock()">${svg('face', 20)} Unlock with Face ID</button>`;
    L.classList.remove('hide');
  } else { L.classList.add('hide'); L.innerHTML = ''; }
}
async function unlock(){
  if (unlocking) return; unlocking = true;
  try {
    await navigator.credentials.get({ publicKey: { challenge: rnd(32), allowCredentials: [{ type: 'public-key', id: unb64(LS.get('mm_cred')) }],
                                                   userVerification: 'required', timeout: 60000 } });
    setLocked(false); haptic();
    if (Date.now() - lastLoad > 30000) load();
  } catch(e) { const m = $('lockMsg'); if (m) m.textContent = 'Tap the button to unlock'; }
  finally { unlocking = false; }
}
async function fidToggle(){
  if (fidOn()) { if (!confirm('Turn off Face ID lock for this app?')) return; LS.del('mm_cred'); render(); return toast('Face ID lock off'); }
  try {
    const c = await navigator.credentials.create({ publicKey: {
      challenge: rnd(32), rp: { name: 'Money' }, user: { id: rnd(16), name: 'Money app', displayName: 'Money app' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
      timeout: 60000, attestation: 'none' } });
    LS.set('mm_cred', b64(c.rawId)); haptic(); render(); toast('✓ Face ID lock on');
  } catch(e) { toast('Face ID wasn’t turned on. ' + (e.name === 'NotAllowedError' ? 'Cancelled.' : e.message)); }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { document.body.classList.add('blur'); if (fidOn()) setLocked(true); }
  else {
    document.body.classList.remove('blur');
    if (locked) unlock();
    else if (D && Date.now() - lastLoad > 30000) load();
  }
});
window.addEventListener('pagehide', () => { if (fidOn()) setLocked(true); });

let savedY = 0;
function closeSheet(){
  $('sheet').classList.remove('open'); $('pn').style.transform = '';
  if (document.body.classList.contains('lock')) { document.body.classList.remove('lock'); document.body.style.top = ''; window.scrollTo(0, savedY); }
}
$('bd').onclick = closeSheet;
(function(){
  let y0 = null, dy = 0, fromBody = false;
  const pn = $('pn');
  pn.addEventListener('touchstart', e => {
    const inHead = e.target.closest('.grab,.shd'), b = $('shb');
    fromBody = !inHead && b && b.contains(e.target) && b.scrollTop <= 0 && !e.target.closest('.keys,.chips,.cats,input,select,textarea,.hist');
    if (!inHead && !fromBody) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0;
  }, { passive: true });
  pn.addEventListener('touchmove', e => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (dy <= 0) { if (fromBody) y0 = null; pn.style.transform = ''; return; }
    if (fromBody && dy < 12) return;
    pn.classList.add('drag'); pn.style.transform = `translateY(${dy}px)`;
    if (e.cancelable) e.preventDefault();
  }, { passive: false });
  pn.addEventListener('touchend', () => {
    if (y0 === null) return; pn.classList.remove('drag');
    if (dy > 110) { haptic(); closeSheet(); } else pn.style.transform = '';
    y0 = null;
  });
})();

/* ============ pull to refresh ============ */
(function(){
  let y0 = null, dy = 0;
  window.addEventListener('touchstart', e => { y0 = (window.scrollY <= 0 && !document.body.classList.contains('lock') && !e.target.closest('.swr')) ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
  window.addEventListener('touchmove', e => {
    if (y0 === null) return; dy = e.touches[0].clientY - y0; const p = $('ptr'); if (!p) return;
    if (dy > 0) { p.style.transition = 'none'; p.style.height = Math.min(60, dy / 2.2) + 'px'; p.textContent = dy > 120 ? 'Release to refresh' : 'Pull to refresh'; }
  }, { passive: true });
  window.addEventListener('touchend', () => {
    const p = $('ptr'); if (y0 === null || !p) return; y0 = null; p.style.transition = '';
    if (dy > 120) { haptic(); p.style.height = '36px'; p.innerHTML = '<div class="spin" style="margin:0 0 6px"></div>'; load(); }
    else p.style.height = '0';
  });
})();
function ptrDone(){ const p = $('ptr'); if (p) p.style.height = '0'; }

/* ============ swipe rows: left = delete, right = edit ============ */
function swRow(inner, row){
  return `<div class="swr" data-row="${row}"><div class="act ed">Edit</div><div class="act del" onclick="delEntry(${row})">Delete</div><div class="in">${inner}</div></div>`;
}
function bindSwipes(){
  document.querySelectorAll('.swr').forEach(w => {
    const el = w.querySelector('.in'); let x0, y0, dx, mode;
    w.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; mode = null;
      document.querySelectorAll('.swr .in').forEach(o => { if (o !== el) o.style.transform = ''; }); }, { passive: true });
    w.addEventListener('touchmove', e => {
      const mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
      if (!mode) { if (Math.abs(mx) > 8 && Math.abs(mx) > Math.abs(my)) mode = 'h'; else if (Math.abs(my) > 8) mode = 'v'; }
      if (mode !== 'h') return;
      if (e.cancelable) e.preventDefault();
      const base = el.dataset.open === '1' ? -84 : 0;
      dx = Math.max(-120, Math.min(110, base + mx)); el.classList.add('drag'); el.style.transform = `translateX(${dx}px)`;
    }, { passive: false });
    w.addEventListener('touchend', () => {
      if (mode !== 'h') return; el.classList.remove('drag');
      if (dx < -55) { el.style.transform = 'translateX(-84px)'; el.dataset.open = '1'; haptic(); }
      else if (dx > 70) { el.style.transform = ''; el.dataset.open = ''; haptic(); openEntry(+w.dataset.row); }
      else { el.style.transform = ''; el.dataset.open = ''; }
    });
  });
}

function renderActivity(){

  for (let i = 0; i < firstDow; i++) h += `<div class="dd e"></div>`;
  X.days.forEach((d, i) => {
    const fut = Pd.isCurrent && i >= Pd.elapsed, n = pd(d.d).getUTCDate();

    h += `<button class="dd ${cls} ${selDay === d.d ? 'sel' : ''} ${d.d === Pd.todayKey ? 'today' : ''}" ${fut ? 'disabled' : `onclick="selDay=selDay==='${d.d}'?null:'${d.d}';haptic();render()"`}>${n}${!fut && d.amt > 0 ? `<small class="n">${f0(d.amt)}</small>` : ''}</button>`;
  });
  h += `</div></div>`;
  const F = [['all','All'],['every','Everyday'],['bills','Bills'],['in','Money in']];
  h += `<div class="seg">` + F.map(f => `<button class="${filt === f[0] ? 'on' : ''}" onclick="filt='${f[0]}';haptic();render()">${f[1]}</button>`).join('') + `</div>`;
  const g = {}; X.cats.forEach(c => g[c.name] = c.group);
  let tx = X.txns.filter(x => {
    const inc = x.cat === 'Salary' || x.cat === 'Commission';
    if (selDay && x.date !== selDay) return false;
    if (filt === 'every') return !inc && (g[x.cat] === 'daily' || g[x.cat] === 'other') && x.cat !== 'Card Payment';
    if (filt === 'bills') return g[x.cat] === 'bill' || x.cat === 'Card Payment';

function txItem(x){

  return h + `<div class="xs muted" style="text-align:center;margin-top:14px;line-height:1.5">“~” means it changes each month: the app uses the average of your last 3 bills.<br>Tap any line to change it.</div>`;

function costRow(x){
  const subs = x.cat === 'Subscriptions';
  const tag = onCard(x) ? '<span class="tag" style="background:var(--track);color:var(--mut)">On card</span>' : x.done ? '<span class="tag paid">Paid</span>' : x.due && dTo(x.due) < 0 ? '<span class="tag late">Late</span>' : '';
  let sub = [];
  if (subs) sub.push(D.costs.subs.length ? D.costs.subs.map(s => s.name).join(' · ') : 'Add your subscriptions');
  else {
    const names = (x.parts || []).map(p => partName(p.name)).filter(n => ![x.cat.toLowerCase(), short(x.cat).toLowerCase()].includes(n.toLowerCase()));
    if (names.length) sub.push(names.join(' · '));
    if (x.due) sub.push(x.done ? 'paid ' + f0(x.paid) : rel(x.due).replace('Due ', 'due ').replace(/^due (\d)/, 'due $1'));
    else if (x.done) sub.push('paid ' + f0(x.paid));
    if (x.changes) sub.push('changes');
    if (x.ends && names.length < 2) sub.push('ends ' + monY(x.ends));
    if (x.card && x.card !== 'ADCB Debit' && names.length < 2) sub.push(payShort(x.card) + ' card');
    if (!sub.length) sub.push(x.amount ? 'every month' : 'add amount later');
  }
  return `<button class="it" onclick="${subs ? 'openSubs()' : `openCost(${jq(x.cat)})`}">${ib(x.cat)}<div class="mid"><div class="t">${esc(short(x.cat))}${tag}</div><div class="s">${esc(sub.join(' · '))}</div></div>
    <div class="amt n">${x.est ? '~ ' : ''}${f0(x.amount)}</div><span class="chev">${svg('chev', 16, 2)}</span></button>`;
}

const payOpts = sel => D.lists.payments.map(p => `<option ${p === sel ? 'selected' : ''} value="${esc(p)}">${esc(payShort(p))}</option>`).join('');
const secOpts = sel => [['Main','Monthly'],['Installments','Installments'],['Home','Home']].map(s => `<option value="${s[0]}" ${s[0] === sel ? 'selected' : ''}>${s[1]}</option>`).join('');
function tgl(el){ haptic(); el.classList.toggle('on'); }
function histBars(x){
  const hs = x.history || []; if (!hs.some(h => h.amt > 0)) return '';
  const mx = Math.max(...hs.map(h => h.amt), x.amount || 0, 1);
  return `<div class="card" style="padding:8px 12px;margin-top:12px"><div class="hist">` + hs.map((h, i) => {
    const now = i === hs.length - 1, v = now && !h.amt ? x.amount : h.amt;
    return `<div class="hb ${now && !h.amt ? 'now' : ''}"><b class="n">${now && !h.amt ? '~' : ''}${f0(v)}</b><i style="height:${Math.max(4, v / mx * 80)}px"></i>${h.m}</div>`; }).join('') + `</div></div>`;
}
function openCost(cat){
  const x = allCosts().find(c => c.cat === cat); if (!x) return; haptic(); F.c = x;
  const debt = x.source === 'debt', subs = x.source === 'subs';
  const capT = { avg: 'Average of your last bills. Updates when you pay.', manual: 'The amount you set.', debt: 'From your Debt Tracker.',
                 budget: 'Same every month.', guess: 'A rough guess until your first bill.', subs: 'Total of your subscriptions.' }[x.source] || '';
  let b = `<div class="disp n" style="margin-top:2px">${x.est ? '~ ' : ''}${f0(x.amount)}<small> AED</small></div><div class="cap">${capT}${onCard(x) ? ' Charged to your ' + esc(payShort(x.card)) + ' card, paid with the card bill.' : ''}${x.done ? ' · paid ' + f0(x.paid) + ' this month' : ''}</div>`;
  if (!debt) b += histBars(x);
  if (debt && x.parts) b += `<div class="lbl">Made of</div><div class="card">` + x.parts.map(p => `<div class="it"><div class="mid"><div class="t">${esc(p.name)}</div>
      <div class="s">${p.payLeft} × ${f0(p.monthly)} left${isK(p.final) ? ' · ends ' + monY(p.final) : ''}</div></div><div class="amt n">${f0(p.left)}</div></div>`).join('') + `</div>`;
  b += `<div class="lbl">Details</div><div class="card" style="padding:0 14px">`;
  if (!debt && !subs) b += `<div class="opt">Amount<input id="cAmt" inputmode="decimal" placeholder="${x.changes ? 'use average' : f0(x.amount)}" value="${x.manual !== null && x.manual !== undefined ? x.manual : ''}"></div>
      <button class="opt" style="width:100%" onclick="tgl($('cChg'))">Changes each month<span class="tg ${x.changes ? 'on' : ''}" id="cChg"></span></button>`;
  if (!debt) b += `<div class="opt">Due day<select id="cDue">${dayOpts(x.dueDay)}</select></div>`;
  b += `<div class="opt">Usually paid with<select id="cCard">${payOpts(x.card)}</select></div>`;
  if (!subs) b += `<div class="opt">Group<select id="cSec">${secOpts(x.section)}</select></div>`;
  if (!debt && !subs) b += `<div class="opt">Ends on<input id="cEnd" type="date" value="${x.ends || ''}"></div>`;
  b += `</div>`;
  if (debt) b += `<div class="xs muted" style="margin:8px 6px">To change these amounts, add or edit the installment in Debts.</div>`;
  openSheet(`${ib(cat, 'sm')} ${esc(short(cat))}`, b,
    `<div class="btns">${x.done || onCard(x) ? '' : `<button class="save soft" onclick="payCost(${jq(cat)})">Mark paid</button>`}<button class="save main" onclick="saveCost()">Save</button></div>` +
    (debt || subs ? '' : `<button class="save red" style="height:44px;font-size:14.5px" onclick="if(confirm('Remove ${esc(short(cat))} from your monthly costs?'))run('costRemove',{cat:F.c.cat})">Remove</button>`));
}
function saveCost(){
  const x = F.c;
  run('costSave', { cat: x.cat, section: $('cSec') ? $('cSec').value : x.section, due: $('cDue') ? $('cDue').value : x.dueDay,
    changes: $('cChg') ? $('cChg').classList.contains('on') : x.changes, card: $('cCard').value,
    ends: $('cEnd') ? $('cEnd').value : x.ends, amount: $('cAmt') ? $('cAmt').value.trim() : (x.manual ?? '') });
}
function openNewCost(){
  haptic();
  openSheet('New monthly cost', `<div class="lbl">Name</div><input class="field" id="nName" placeholder="e.g. Parking permit">
    <div class="lbl">Details</div><div class="card" style="padding:0 14px">
      <div class="opt">Amount<input id="nAmt" inputmode="decimal" placeholder="0"></div>
      <button class="opt" style="width:100%" onclick="tgl($('nChg'))">Changes each month<span class="tg" id="nChg"></span></button>
      <div class="opt">Due day<select id="nDue">${dayOpts(0)}</select></div>
      <div class="opt">Usually paid with<select id="nCard">${payOpts('ADCB Debit')}</select></div>
      <div class="opt">Group<select id="nSec">${secOpts('Main')}</select></div></div>
    <div class="xs muted" style="margin:8px 6px">Not sure of the amount? Put a rough guess and turn on “Changes each month”. It learns from what you pay.</div>`,
    `<button class="save main" onclick="run('costAdd',{name:$('nName').value,amount:$('nAmt').value,changes:$('nChg').classList.contains('on'),due:$('nDue').value,card:$('nCard').value,section:$('nSec').value})">Add</button>`);
}

/* ============ subscriptions ============ */
function openSubs(){
  haptic(); const s = D.costs.subs, tot = sum(s, x => x.amount);
  openSheet(`${ib('Subscriptions', 'sm')} Subscriptions`, `<div class="disp n">${f0(tot)}<small> AED / month</small></div><div class="cap">This is your Subscriptions budget. It updates by itself.</div>
    <div class="card" style="margin-top:14px">` + (s.length ? s.map((x, i) => `<button class="it" onclick="openSub(${i})">${ib('Subscriptions', 'sm')}<div class="mid"><div class="t">${esc(x.name)}</div><div class="s">${esc(payShort(x.card))}</div></div><div class="amt n">${fm(x.amount)}</div><span class="chev">${svg('chev', 16, 2)}</span></button>`).join('')
      : `<div class="empty">No subscriptions yet</div>`) + `</div>`,
    `<button class="save main" onclick="openSub()">Add a subscription</button>`);
}
function openSub(i){
  const s = i === undefined ? null : D.costs.subs[i]; F.s = s;
  openSheet(s ? esc(s.name) : 'New subscription', `<div class="lbl">Name</div><input class="field" id="sn" value="${esc(s ? s.name : '')}" placeholder="e.g. Netflix">
    <div class="lbl">Price per month</div><input class="field n" id="sa" inputmode="decimal" value="${s ? s.amount : ''}" placeholder="0">
    <div class="lbl">Card</div>${chips('sc', D.lists.payments, s ? s.card : 'Touch Points Card', v => esc(payShort(v)))}`,
    `<div class="btns">${s ? `<button class="save red" onclick="if(confirm('Remove ${esc(s.name)}?'))run('subDelete',{name:F.s.name})">Remove</button>` : ''}<button class="save main" onclick="run('subSave',{name:$('sn').value,amount:$('sa').value,card:pick('sc'),old:F.s?F.s.name:''})">Save</button></div>`);
}

/* ============ card bill ============ */
function openCard(i){
  haptic(); const c = D.cards[i]; F.ci = i; F.showBuys = false;
  const others = D.cards.filter(x => x.total > 0 || x.next.purchases > 0 || x.inst.length);
  let b = others.length > 1 ? `<div class="sg">` + others.map(x => `<button class="${x === c ? 'on' : ''}" onclick="openCard(${D.cards.indexOf(x)})">${esc(x.short)}</button>`).join('') + `</div>` : '';
  b += `<div style="text-align:center;margin:12px 0 4px"><div class="xs muted">${c.done ? 'Paid ✓' : 'To pay by ' + nice(c.due)}</div>
    <div class="disp n" style="padding-top:2px">${f0(c.done ? c.total : c.left)}<small> AED</small></div>
    <div class="cap">Statement ${nice(c.stmt)} · covers ${nice(c.from)} – ${nice(c.stmt)}</div></div>`;
  b += `<div class="card" style="padding:2px 16px;margin-top:10px">
    <button class="line" style="width:100%" onclick="F.showBuys=!F.showBuys;$('buys').classList.toggle('hide')"><b style="font-weight:550">Purchases</b><span class="n">${c.count} items ›&nbsp;&nbsp;<b style="color:var(--text)">${f0(c.purchases)}</b></span></button>
    <div id="buys" class="hide">${c.items.map(t => `<div class="line" style="padding:8px 0 8px 12px;font-size:13px"><span>${nice(t.date)} · ${esc(t.desc || short(t.cat))}</span><span class="n">${f2(t.amt)}</span></div>`).join('') || '<div class="line"><span>None logged</span></div>'}</div>` +
    c.inst.map(x => `<div class="line"><b style="font-weight:550">${esc(short(x.name))} installments${x.parts && x.parts.length ? `<div class="xs muted" style="font-weight:400;margin-top:2px">${esc(x.parts.map(p => partName(p.name)).join(' · '))}</div>` : ''}</b><b class="n">${f0(x.amt)}</b></div>`).join('') +
    `<div class="line"><b>${c.override !== null ? 'App’s total' : 'Total'}</b><b class="n">${f0(c.calc)}</b></div>` +
    (c.override !== null ? `<div class="line"><b>Bank says</b><span><b class="n" style="color:var(--text)">${f0(c.override)}</b> · <button style="color:var(--acc);font-weight:600" onclick="run('cardSet',{card:${jq(c.card)},stmt:${jq(c.stmt)},amount:''})">Reset</button></span></div>` : '') +
    (c.paid > 0 ? `<div class="line"><span>Paid so far</span><b class="n">${f0(c.paid)}</b></div><div class="line"><b>Left</b><b class="n">${f0(c.left)}</b></div>` : '') + `</div>
    <div class="xs muted" style="margin:10px 6px;line-height:1.5">Since ${nice(c.next.from)} you’ve spent <b class="n" style="color:var(--text)">${f0(c.next.purchases)}</b> on this card. It goes on the ${nice(c.next.due)} bill.</div>`;
  openSheet(`${svg('card', 18)} Card bill`, b,
    (c.done ? '' : `<button class="save main" onclick="openPayCard(${i})">I paid it</button>`) +
    `<button class="save soft" style="height:44px;font-size:14.5px" onclick="openCardSet(${i})">Bank says a different amount?</button>`);
}
function openCardSet(i){
  const c = D.cards[i]; F.ci = i; K.v = c.override !== null ? String(c.override) : '';
  openSheet(`${esc(c.short)} statement`, `<div class="cap" style="margin-top:6px">Type the total from your ${nice(c.stmt)} statement. The app will use it instead.</div><div class="disp" id="disp"></div>`,
    keypad() + `<button class="save main" onclick="if(!(Number(K.v)>=0)||K.v==='')return toast('Type the amount');run('cardSet',{card:${jq(c.card)},stmt:${jq(c.stmt)},amount:K.v})">Save</button>`);
  disp();
}

/* ============ debt details + pay faster ============ */
function openDebt(i){
  const d = D.debts[i]; haptic(); F.d = d; F.extra = 0;
  openSheet(`${ib(debtCat(d), 'sm')} ${esc(d.name)}`, `<div class="disp n">${f0(d.left)}<small> AED left</small></div>
    <div class="bar" style="margin:8px 30px 4px;height:7px"><i style="width:${(d.pct || 0) * 100}%;background:var(--good)"></i></div><div class="cap">${Math.round((d.pct || 0) * 100)}% paid off</div>
    <div class="card" style="padding:2px 16px;margin-top:14px">
      <div class="line"><span>Each month</span><b class="n">${f2(d.monthly)}</b></div>
      <div class="line"><span>Payments left</span><b class="n">${d.payLeft}</b></div>
      <div class="line"><span>Next payment</span><b>${isK(d.next) ? nice(d.next) + ' ' + d.next.slice(0, 4) : esc(d.next)}</b></div>
      <div class="line"><span>Last payment</span><b>${isK(d.final) ? monY(d.final) : '—'}</b></div>
      <div class="line"><span>Original</span><b class="n">${f0(d.original)}</b></div>
      <div class="line"><span>Paid so far</span><b class="n">${f0(d.settled)}</b></div></div>
    ${d.left > 0 && d.monthly > 0 ? `<div class="lbl">Pay faster</div><div class="card pad"><div class="row sm"><span>Extra each month</span><b class="n" id="exV">0</b></div>
      <input type="range" min="0" max="3000" step="100" value="0" style="margin-top:12px" oninput="F.extra=+this.value;updFaster()"><div class="sm" id="exO" style="margin-top:8px"></div>
      <div class="xs muted" style="margin-top:6px">Estimate. Interest and bank rules not included.</div></div>` : ''}`, '');
  updFaster();
}
function updFaster(){
  const d = F.d, o = $('exO'); if (!o) return;
  const m = Math.ceil(d.left / (d.monthly + F.extra)), saved = Math.max(0, Math.ceil(d.left / d.monthly) - m);
  const s = isK(d.next) ? pd(d.next) : pd(today()); s.setUTCMonth(s.getUTCMonth() + m - 1);
  $('exV').textContent = f0(F.extra) + ' AED';
  o.innerHTML = F.extra ? `Finished <b>${MON[s.getUTCMonth()]} ${s.getUTCFullYear()}</b>, <b style="color:var(--good)">${saved} month${saved === 1 ? '' : 's'} sooner</b>` : `Finished <b>${MON[s.getUTCMonth()]} ${s.getUTCFullYear()}</b> at the normal pace`;
}

/* ============ explainers & balance ============ */
function openSalaryLeft(){
  const s = D.salaryLeft; if (!s) return; haptic();
  openSheet('Salary left', `<div class="disp n">${f0(s.left)}<small> AED</small></div><div class="cap">What you can still use from this month’s salary</div>
    <div class="card" style="padding:2px 16px;margin-top:14px">
      <div class="line"><span>Salary ${s.received ? '' : '(expected)'}</span><b class="n">${f0(s.base)}</b></div>
      <div class="line"><span>Paid from salary (debit & cash)</span><b class="n">− ${f0(s.out)}</b></div>
      ${s.cardPaid ? `<div class="line"><span>Card bills paid</span><b class="n">− ${f0(s.cardPaid)}</b></div>` : ''}
      <div class="line"><span>Card bill still to pay</span><b class="n">− ${f0(s.owed)}</b></div>
      <div class="line"><b>Salary left</b><b class="n">${f0(s.left)}</b></div></div>
    <div class="xs muted" style="margin:10px 6px;line-height:1.5">Card purchases leave your account on the 18th, so the card bill is taken out already. Paying it won’t change this number.</div>`, '');
}
function openCommission(){
  const c = D.commission; haptic();
  openSheet('Commission', `<div class="disp n">${f0(c.left)}<small> AED left</small></div>
    <div class="card" style="padding:2px 16px;margin-top:14px">
      <div class="line"><span>Received this month</span><b class="n">${f0(c.received)}</b></div>
      <div class="line"><span>Used</span><b class="n">− ${f0(c.spent)}</b></div>
      <div class="line"><span>Saved (goal 70%)</span><b class="n">${f0(c.saved)} / ${f0(c.target)}</b></div></div>` +
    (c.toSave > 0 ? `<button class="save main" style="margin-top:14px" onclick="openCommSave()">Move ${f0(c.toSave)} to ${esc(short(c.goTo))}</button>` : ''), '');
}
function openBalance(){
  haptic(); K.v = ''; const bl = D.balance;
  openSheet('ADCB balance', `<div class="cap" style="margin-top:6px">${bl ? 'Last: <b>' + f0(bl.balance) + '</b> · ' + esc(bl.time || '') + '<br>' : ''}It updates by itself from debit card SMS. Type it only to update now.</div><div class="disp" id="disp"></div>`,
    keypad() + `<button class="save main" onclick="if(K.v==='')return toast('Type your balance');run('balance',{balance:K.v})">Check</button>`);
  disp();
}
function openForgot(){
  const p = D.balance ? D.balance.pending || 0 : 0; haptic();
  openSheet('Spending I forgot', `<div style="display:flex;justify-content:center;margin-top:6px">${ibk('warn', '#e19a12', 'lg', 26)}</div>
    <div class="disp n">${f0(p)}<small> AED</small></div><div class="cap" style="line-height:1.5">Left your ADCB account without being logged.<br>A transfer, cash, or something you forgot?</div>
    <div class="xs muted" style="margin:16px 6px;line-height:1.5">Best: log the real items with + (the warning clears by itself). Or log it all as Other, or ignore it.</div>`,
    `<div class="btns"><button class="save soft" onclick="run('balanceClear',{log:false})">Ignore</button><button class="save main" onclick="run('balanceClear',{log:true})">Log as Other</button></div>`);
}

/* ============ shops, new category, installment ============ */
function openShop(i){
  const s = D.shops[i]; F.sh = s; haptic();
  openSheet(esc(s.name), `<div class="cap" style="margin:6px 0 4px">When this shop is in a bank SMS:</div>
    <div class="chips" style="margin:10px 0"><button class="chip ${s.mode === 'ask' ? 'on' : ''}" id="askC" onclick="this.classList.add('on');document.querySelectorAll('#shc .on').forEach(x=>x.classList.remove('on'))">Always ask me</button></div>
    ${catGrid('shc', dailyCats().concat(D.lists.all.filter(n => !dailyCats().includes(n))), s.mode === 'ask' ? '' : s.category)}`,
    `<div class="btns"><button class="save red" onclick="run('shopDelete',{shop:F.sh.name})">Forget</button><button class="save main" onclick="run('shopSave',{shop:F.sh.name,category:pick('shc')||'ask'})">Save</button></div>`);
  $('shc').onpick = () => $('askC').classList.remove('on');
}
function openNewCategory(){
  haptic(); K.v = '';
  openSheet('New category', `<div class="lbl">Name</div><input class="field" id="cn" placeholder="e.g. Haircut"><div class="lbl">Budget per month</div><div class="disp" id="disp"></div>`,
    keypad() + `<button class="save main" onclick="run('category',{name:$('cn').value,budget:K.v||0,group:'daily'})">Add</button>`);
  disp();
}
function openInstallment(){
  haptic();
  openSheet('New installment', `<div class="lbl">What did you buy?</div><input class="field" id="ni" placeholder="e.g. AirPods">
    <div class="lbl">Provider</div>${chips('np', ['Tabby','Tamara','Touch Points'], 'Tamara')}
    <div class="lbl">Total price</div><input class="field n" id="nt" inputmode="decimal" placeholder="0">
    <div class="row" style="gap:10px"><div style="flex:1"><div class="lbl">Payments</div><input class="field n" id="nc" inputmode="numeric" value="4"></div>
    <div style="flex:1"><div class="lbl">Already paid</div><input class="field n" id="npd" inputmode="numeric" value="1"></div></div>
    <div class="lbl">Next payment</div><input class="field" id="nn" type="date" value="${today()}">`,
    `<button class="save main" onclick="run('installment',{item:$('ni').value,provider:pick('np'),total:$('nt').value,count:$('nc').value,paid:$('npd').value,nextDate:$('nn').value})">Add installment</button>`);
}

/* ============ start ============ */
if (!API || !TOKEN) setup();
else {
  if (fidOn() && fidOk()) { setLocked(true); unlock(); }
  if (D) render();
  load();
}
</script>
</body>
</html>
